    - data:
        code: "import json\nimport re\n\ndef main(csv_string):\n    # 1. 去除 Markdown\
          \ 代码块标记和 BOM\n    csv_string = csv_string.strip()\n    if csv_string.startswith('\\\
          ufeff'):\n        csv_string = csv_string[1:]\n    if csv_string.startswith('```csv'):\n\
          \        csv_string = csv_string[5:]\n    elif csv_string.startswith('```'):\n\
          \        csv_string = csv_string[3:]\n    if csv_string.endswith('```'):\n\
          \        csv_string = csv_string[:-3]\n    csv_string = csv_string.strip()\n\
          \n    # 2. 按行分割（保留非空行）\n    lines = [line.strip() for line in csv_string.splitlines()\
          \ if line.strip()]\n    if len(lines) < 2:\n        return {\"result\":\
          \ f\"错误：CSV 至少需要两行（标题+数据）。实际行数：{len(lines)}\"}\n\n    # 3. 手动解析 CSV 行（支持引号内逗号）\n\
          \    def parse_csv_row(row_str):\n        fields = []\n        current =\
          \ ''\n        in_quotes = False\n        for ch in row_str:\n          \
          \  if ch == '\"':\n                in_quotes = not in_quotes\n         \
          \   elif ch == ',' and not in_quotes:\n                fields.append(current.strip())\n\
          \                current = ''\n            else:\n                current\
          \ += ch\n        fields.append(current.strip())\n        # 去除字段首尾的引号\n \
          \       fields = [f.strip('\"') for f in fields]\n        return fields\n\
          \n    parsed_lines = [parse_csv_row(line) for line in lines]\n\n    # 自动修复：如果第一行只有一个字段且第二行有多个字段，则丢弃第一行\n\
          \    if (len(parsed_lines) >= 2 and len(parsed_lines[0]) == 1 and \n   \
          \     len(parsed_lines[1]) > 1):\n        parsed_lines = parsed_lines[1:]\
          \  # 丢弃第一行\n\n    if len(parsed_lines) < 2:\n        return {\"result\"\
          : \"错误：解析后不足两行数据\"}\n\n    headers = parsed_lines[0]\n    data_rows = parsed_lines[1:]\n\
          \n    # 确保所有数据行与标题行列数一致\n    max_cols = len(headers)\n    for row in data_rows:\n\
          \        if len(row) < max_cols:\n            row.extend([''] * (max_cols\
          \ - len(row)))\n        elif len(row) > max_cols:\n            row[:] =\
          \ row[:max_cols]\n\n    # 数字转换函数（自动去除逗号、空格，提取数字）\n    def to_float(s):\n\
          \        if not isinstance(s, str):\n            s = str(s) if s is not\
          \ None else ''\n        s = s.strip()\n        s = s.replace(',', '')\n\
          \        # 提取数字（包括负号和小数点）\n        match = re.search(r'-?\\d+(?:\\.\\d+)?',\
          \ s)\n        if match:\n            try:\n                return float(match.group())\n\
          \            except:\n                return None\n        return None\n\
          \n    # 识别数值列（从第二列开始）\n    numeric_col_indices = []\n    numeric_col_names\
          \ = []\n    for col_idx in range(1, max_cols):\n        for row in data_rows:\n\
          \            val = row[col_idx] if col_idx < len(row) else ''\n        \
          \    if to_float(val) is not None:\n                numeric_col_indices.append(col_idx)\n\
          \                numeric_col_names.append(headers[col_idx])\n          \
          \      break\n\n    if not numeric_col_indices:\n        sample = f\"标题行:\
          \ {headers}\\n第一行数据: {data_rows[0] if data_rows else '无'}\"\n        return\
          \ {\"result\": f\"错误：没有找到数值列。请检查 CSV 中是否包含数字。\\n解析结果样例：\\n{sample}\"}\n\n\
          \    # X 轴类别（第一列）\n    x_axis_data = [row[0].strip() or f\"项{i+1}\" for\
          \ i, row in enumerate(data_rows)]\n\n    # 构建系列\n    series_list = []\n\
          \    for idx, col_idx in enumerate(numeric_col_indices):\n        series_data\
          \ = []\n        for row in data_rows:\n            val = row[col_idx] if\
          \ col_idx < len(row) else ''\n            num = to_float(val)\n        \
          \    if num is None:\n                num = 0\n            series_data.append(num)\n\
          \        series_list.append({\n            \"name\": numeric_col_names[idx],\n\
          \            \"type\": \"bar\",\n            \"data\": series_data\n   \
          \     })\n\n    # ECharts 配置\n    echarts_config = {\n        \"tooltip\"\
          : {\"trigger\": \"axis\", \"axisPointer\": {\"type\": \"shadow\"}},\n  \
          \      \"legend\": {\"data\": numeric_col_names},\n        \"xAxis\": {\"\
          type\": \"category\", \"data\": x_axis_data, \"axisLabel\": {\"rotate\"\
          : 30 if len(x_axis_data) > 8 else 0}},\n        \"yAxis\": {\"type\": \"\
          value\"},\n        \"series\": series_list\n    }\n\n    output = f'```echarts\\\
          n{json.dumps(echarts_config, ensure_ascii=False)}\\n```'\n    return {\"\
          result\": output}"
        code_language: python3
