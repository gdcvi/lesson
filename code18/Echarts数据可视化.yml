    - data:
        code: "import csv\nimport json\n\ndef main(csv_string: str):\n    \"\"\"\n\
          \    将 CSV 格式的字符串转换为 ECharts 饼状图配置。\n    CSV 至少包含两列：第一列为类别标签，第二列为数值。\n \
          \   \"\"\"\n    # 解析 CSV 字符串\n    lines = csv_string.strip().split('\\n')\n\
          \    reader = csv.reader(lines)\n    rows = list(reader)\n\n    if len(rows)\
          \ < 2:\n        # 没有数据行，返回空配置\n        return {\"result\": \"```echarts\\\
          n{}\\n```\"}\n\n    # 提取标签和数值\n    labels = []\n    values = []\n    for\
          \ row in rows[1:]:\n        if len(row) >= 2:\n            label = row[0].strip()\n\
          \            try:\n                value = float(row[1])\n            except\
          \ ValueError:\n                continue\n            if value > 0:  # 饼图只取正值\n\
          \                labels.append(label)\n                values.append(value)\n\
          \n    if not values:\n        return {\"result\": \"```echarts\\n{}\\n```\"\
          }\n\n    # 构造饼图数据格式\n    pie_data = [{\"name\": label, \"value\": val} for\
          \ label, val in zip(labels, values)]\n\n    # ECharts 饼图配置\n    echarts_config\
          \ = {\n        \"tooltip\": {\n            \"trigger\": \"item\",\n    \
          \        \"formatter\": \"{a} <br/>{b}: {c} ({d}%)\"\n        },\n     \
          \   \"legend\": {\n            \"orient\": \"vertical\",\n            \"\
          left\": \"left\",\n            \"data\": labels\n        },\n        \"\
          series\": [{\n            \"name\": \"数据分布\",\n            \"type\": \"\
          pie\",\n            \"radius\": \"50%\",\n            \"data\": pie_data,\n\
          \            \"emphasis\": {\n                \"itemStyle\": {\n       \
          \             \"shadowBlur\": 10,\n                    \"shadowOffsetX\"\
          : 0,\n                    \"shadowColor\": \"rgba(0, 0, 0, 0.5)\"\n    \
          \            }\n            }\n        }]\n    }\n\n    # 生成输出（格式与原始代码一致）\n\
          \    output = f'```echarts\\n{json.dumps(echarts_config, ensure_ascii=False)}\\\
          n```'\n    return {\"result\": output}"
